name: Render Backend 24/7 Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend API
        run: |
          curl -s -f https://codemind-ai-qdgi.onrender.com/api/health || echo "Ping failed or server waking up"
